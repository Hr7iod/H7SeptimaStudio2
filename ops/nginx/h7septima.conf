# Separate virtual host. The existing putniq.ru configuration is unchanged.
server {
    listen 80;
    listen [::]:80;
    server_name h7septima.ru www.h7septima.ru;

    root /var/www/h7septima.ru/html;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://h7septima.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name h7septima.ru;

    ssl_certificate /etc/letsencrypt/live/h7septima.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/h7septima.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/h7septima.ru/html;
    index index.html;

    access_log /var/log/nginx/h7septima.access.log;
    error_log /var/log/nginx/h7septima.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
