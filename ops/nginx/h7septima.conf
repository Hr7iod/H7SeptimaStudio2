# Separate virtual host. The existing putniq.ru configuration is unchanged.
# Enable HTTPS after h7septima.ru DNS points to this server.
server {
    listen 80;
    listen [::]:80;
    server_name h7septima.ru www.h7septima.ru;

    root /var/www/h7septima.ru/html;
    index index.html;

    access_log /var/log/nginx/h7septima.access.log;
    error_log /var/log/nginx/h7septima.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
